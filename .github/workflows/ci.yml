name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A pull request runs the tests that are not marked slow; main, tags and release/* pull
  # requests run all of them, four at a time. All three versions run in both cases, so the
  # required checks `check (3.12)` and `check (3.13)` always report.
  check:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      PYTEST_ADDOPTS: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') && '-m "not slow"' || '-n 4' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
          enable-cache: true
      - run: make sync
      - run: make check  # includes dupcheck (jscpd via the runner's preinstalled Node)

  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build the pure wheel and the Linux x86_64 wheel with the census library
        run: |
          uv build
          TENSWARD_PLATFORM_WHEEL=1 uv build --wheel --out-dir dist
          test "$(ls dist/*.whl | wc -l)" = 2
          unzip -Z1 dist/*manylinux_2_28_x86_64.whl | grep census/lib/manifest.json > /dev/null
          test "$(unzip -Z1 dist/*-none-any.whl | grep -c census/lib/)" = 0
