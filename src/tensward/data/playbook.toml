[[entry]]
name = "kv-q8"
engines = ["llamacpp"]
addresses = ["kv_capacity"]
levers = ["kv_cache_precision"]
sets = { kv_cache_precision = "8bit" }
applies = "llamacpp:kv_q8_applies"
apply = "llamacpp:with_kv_q8"
evidence = "ours"
costs = "answers may change with an 8-bit KV cache; the floor between two f16 runs is 11 of 40 identical prompts"
quality_risk = true
changes_answers = true
answer_risk = "low"
answer_bits = 8
helps = ["goodput", "req_s", "throughput"]
prior = "Qwen3-8B Q4_K_M at 96 clients, np 4 to 32 / 48: throughput +111.5% / +117.2%. 1 repeat per arm. Answers, checked on np24 (Gemma np16): 13 of 40 prompts identical to the f16 run (37 of 40 match one of the two f16 baselines), against 11 of 40 identical between the two f16 runs; Gemma 4 E4B: 6 of 40 against 4 of 40. A floor this low says little"
effects = { throughput = "improves: twice the tokens fit the KV cache", ttft = "improves: fewer requests wait for KV-cache space", tpot = "improves: less KV cache is read in each decode step" }
then = { limit = "queueing", signal = "requests waiting at the slot count" }

