effects = { throughput = "improves: more requests fit the KV cache at once", ttft = "improves: fewer requests wait for KV-cache space", tpot = "none: fewer preemptions, but more sequences in each step" }
then = { limit = "queueing", signal = "requests waiting at the concurrency cap" }

