[[entry]]
name = "offload-experts"
engines = ["llamacpp"]
addresses = ["offload"]
levers = ["host_expert_layers"]
applies = "llamacpp:offload_experts_applies"
apply = "llamacpp:with_host_experts"
evidence = "ours"
costs = "the host must hold the expert tensors; the count is set at engine start; answers changed on 5 of 40 prompts against a floor of 21 of 40 identical"
quality_risk = true
changes_answers = true
answer_risk = "low"
helps = ["throughput", "tpot"]
prior = "Qwen3-30B-A3B Q6_K, L4, matched device MiB. An -ngl split against --n-cpu-moe: TPOT +21.5% to +52.7% worse at c1 (CI lower bounds +19.0% to +37.1%) and throughput -15.2% to -23.6% at c8 (upper bounds -11.3% to -19.9%), at 12, 24, 36 and 48 expert layers on the host. 3 repeats per arm"
effects = { throughput = "improves: attention and the shared layers stay on the device, so fewer host bytes are read per token", ttft = "none: prompt processing depends on the micro-batch size", tpot = "improves: only the expert tensors stay on the host, which moves fewer bytes per token than a layer split" }
then = { limit = "offload", signal = "host memory bandwidth as the limiting resource" }

