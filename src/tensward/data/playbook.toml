effects = { throughput = "worsens: steps already carried about 2130 tokens against 8192, so the larger budget adds cost without more prompt work (req/s -4.0% and -6.5%)", ttft = "worsens: prompts wait behind steps full of other prompts (TTFT p95 +40.8% and +50.4%)", tpot = "worsens: larger chunks stall running decodes" }
