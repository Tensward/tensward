# The playbook: one table per entry, in ranking order. Edited only in Tensward's private
# repository; propose entries as issues. Conditions and changes are named predicates
# (playbook_common.PREDICATES; "vllm:" ones in engines/vllm/predicates.py, "llamacpp:" ones
# in engines/llamacpp/predicates.py).

[[entry]]
name = "enable-tool-calling"
engines = ["vllm", "llamacpp"]
addresses = ["fit"]
levers = ["tool_calling"]
applies = "enable_tool_calling_applies"
apply = "with_tool_calling"
evidence = "ours"
costs = "none; the server starts accepting tool requests"
basis = "your prompts and settings"
effects = { throughput = "improves: requests that offer tools stop failing", ttft = "none: the time to the first token is unchanged", tpot = "none: the time per token is unchanged" }

[[entry]]
name = "fit-context"
engines = ["vllm", "llamacpp"]
addresses = ["fit"]
levers = ["max_context_len"]
applies = "fit_context_applies"
apply = "with_fitting_context"
evidence = "strong"
costs = "more KV cache per request, so fewer fit at once; answers are reworded when the context grows: 92 of 100, 45 of 100 and 22 of 39 prompts came back identical in the c1 checks on two engines"
changes_answers = true
answer_risk = "low"
effects = { throughput = "improves: requests that did not fit are served; the gain is the served share, not speed: at equal served prompts there is no speed cost when nothing more is served (llama.cpp Qwen3-8B, L4, 3 repeats: req/s -0.4%, TPOT p95 -0.2%, TTFT p95 -0.1%, answers 24 of 24 identical)", ttft = "none: prefill is unchanged", tpot = "none: decode is unchanged" }
then = { limit = "kv_capacity", signal = "KV-cache usage near full with requests waiting" }

[[entry]]
name = "more-kv-memory"
engines = ["vllm"]
addresses = ["kv_capacity"]
levers = ["kv_memory_fraction", "max_concurrent_requests"]
applies = "vllm:more_kv_memory_applies"
apply = "vllm:with_more_kv_memory"
low_bar = "vllm:more_kv_memory_unblocks"
evidence = "strong"
costs = "less memory headroom: the engine may fail to start"
helps = ["goodput", "req_s", "throughput", "tpot", "ttft"]
steps_on = "kv_memory_fraction"
prior = "measured on one preempting granite setup (two repeats): req/s +7%, TTFT p95 -21%; gpu memory utilization 0.92 to 0.95 grew the pool 16%; later runs: req/s +6% to +10%, TTFT p95 -0.4% to -7% while the median fell about 40%"
effects = { throughput = "improves: more requests fit the KV cache at once", ttft = "improves: fewer requests wait for KV-cache space; the median falls (about -40%), and the closed-loop p95 moves only when the pool crosses the clients' working set", tpot = "none: more sequences share each step; preemptions did not fall" }
then = { limit = "queueing", signal = "requests waiting at the concurrency cap" }

