# The playbook: one table per entry, in ranking order. Edited only in Tensward's private
# repository; propose entries as issues. Conditions and changes are named predicates
# (playbook_common.PREDICATES; "vllm:" ones in engines/vllm/predicates.py, "llamacpp:" ones
# in engines/llamacpp/predicates.py).

[[entry]]
name = "enable-tool-calling"
engines = ["vllm", "llamacpp"]
addresses = ["fit"]
levers = ["tool_calling"]
applies = "enable_tool_calling_applies"
apply = "with_tool_calling"
evidence = "ours"
costs = "none; the server starts accepting tool requests"
basis = "your prompts and settings"
effects = { throughput = "improves: requests that offer tools stop failing", ttft = "none: the time to the first token is unchanged", tpot = "none: the time per token is unchanged" }

[[entry]]
name = "fast-quant-kernel"
engines = ["vllm"]
addresses = ["prefill", "decode_bandwidth"]
levers = ["quantization"]
applies = "fast_quant_kernel_applies"
apply = "with_engine_quantization"
evidence = "moderate"
costs = "none expected"
helps = ["goodput", "req_s", "throughput", "tpot", "ttft"]
effects = { throughput = "improves: the fast kernel runs the same matmuls in less time", ttft = "improves: the fast kernel runs the same matmuls in less time", tpot = "improves: the fast kernel runs the same matmuls in less time" }
then = { limit = "decode_bandwidth", signal = "decode at a larger share of its memory-bandwidth ceiling" }

[[entry]]
name = "fit-context"
engines = ["vllm", "llamacpp"]
addresses = ["fit"]
levers = ["max_context_len"]
applies = "fit_context_applies"
apply = "with_fitting_context"
evidence = "strong"
costs = "more KV cache per request, so fewer fit at once"
effects = { throughput = "improves: requests that did not fit are served", ttft = "none: prefill is unchanged", tpot = "none: decode is unchanged" }
then = { limit = "kv_capacity", signal = "KV-cache usage near full with requests waiting" }

[[entry]]
