prior = "With the host memory tight, c1 TPOT -78.5% (260.7 to 56.1 ms; wide interval) against mmap on Qwen3-30B-A3B Q4_K_M with host experts. At the mid and high memory steps no gain. 3 repeats per arm"
effects = { throughput = "improves: decode stops waiting on pages read back from disk", ttft = "none: prompt processing reads the same weights", tpot = "improves: the weights the host holds are not paged out and read back" }

